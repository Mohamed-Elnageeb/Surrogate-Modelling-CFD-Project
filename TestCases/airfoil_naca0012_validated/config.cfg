% NACA0012 validation: RANS / Spalart-Allmaras, Re=1e6, AoA=4 deg
SOLVER= RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

MACH_NUMBER= 0.15
AOA= 4.0
REYNOLDS_NUMBER= 1.0E6
REYNOLDS_LENGTH= 1.0
FREESTREAM_TEMPERATURE= 288.15
REF_DIMENSIONALIZATION= FREESTREAM_VEL_EQ_ONE

MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

MARKER_HEATFLUX= ( Airfoil, 0.0 )
MARKER_FAR= ( Farfield )
MARKER_PLOTTING= ( Airfoil )
MARKER_MONITORING= ( Airfoil )

REF_AREA= 1.0
REF_LENGTH= 1.0

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 10.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.25, 1.0, 1e4 )

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT

ITER= 4000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -11
CONV_STARTITER= 100

HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
OUTPUT_FILES= (RESTART, PARAVIEW)
VOLUME_FILENAME= flow_fields
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)
OUTPUT_WRT_FREQ= 500
