% ---------------------- SU2 GEOMETRY SETUP -------------------------
SOLVER= GEOMETRY
MESH_FORMAT= SU2
MESH_FILENAME= mesh.su2

% ---------------------- GEOMETRY DEFINITION -----------------------
GEOMETRY_KIND= AIRFOIL
AIRFOIL_NACA= 0012
AIRFOIL_CHORD= 1.0
AIRFOIL_CENTER= ( 0.0, 0.0, 0.0 )

% ----------------------- GRID PARAMETERS --------------------------
GEO_MODE= O_GRID
GRID_OUTER_RADIUS= 20.0
GRID_INNER_RADIUS= 0.5
GRID_SPACING_RATIO= 1.05
GRID_POINTS_CIRCUMFERENTIAL= 257
GRID_POINTS_RADIAL= 161
SMOOTHING_ITER= 50

% ----------------------- BOUNDARY MARKERS -------------------------
MARKER_EULER= ( farfield )
MARKER_ANALYTIC= ( airfoil )
MARKER_SYM= ( symmetry )

% ----------------------- OUTPUT CONTROL ---------------------------
GEOMETRY_OUTPUT= YES
GEO_FILENAME= mesh
