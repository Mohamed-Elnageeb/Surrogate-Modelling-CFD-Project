[metadata]
name = cfdagent
version = 0.0.0

[options]
packages = find:
include_package_data = True
install_requires =
    numpy>=2.0
    scipy>=1.11
    neuralfoil>=0.3
    aerosandbox>=4.2
    gmsh>=4.11
    pandas>=2.0
    torch>=2.2
    Pillow>=10.0
    meshio>=5.3
    scikit-learn>=1.3
    matplotlib>=3.7

[options.package_data]
# Experimental validation data must ship with the package: the validation
# module resolves it relative to the installed package, not the source tree.
cfdagent =
    data/experimental/*.dat
    data/experimental/*.md
    configs/*.yaml

[options.entry_points]
console_scripts =
    cfdagent-inspect-dataset = cfdagent.surrogate.inspect_dataset:main
    cfdagent-train-unet = cfdagent.surrogate.train_unet_cli:main
    cfdagent-eval-unet = cfdagent.surrogate.eval_unet_cli:main
    cfdagent-run-param-sweep = cfdagent.cfd.param_sweep_cli:main
