# Flow conditions for the validated reference case.
#
# These values MUST match TestCases/airfoil_naca0012_validated/config.cfg.
# The previous version of this file declared an incompressible, laminar setup at
# M=0.05 while the SU2 case actually run was compressible, laminar at M=0.5 --
# the two disagreed and nothing read this file. Keep them in sync.

solver: SU2
case_dir: TestCases/airfoil_naca0012_validated

free_stream:
  mach_number: 0.15
  reynolds_number: 1.0e6
  reynolds_length: 1.0
  angle_of_attack_deg: 4.0
  temperature_k: 288.15

physical_model:
  # Compressible RANS. Spalart-Allmaras, fully turbulent from the leading edge.
  # Note: the low-fidelity tool (NeuralFoil/XFOIL) models natural transition, so
  # its drag is ~50% lower at these conditions. See the case README before
  # combining the two fidelities.
  equations: RANS
  turbulence_model: SA
  transition_model: none

numerics:
  max_iterations: 4000
  # Acceptance threshold used by run_cfd. Tied to the solver's own convergence
  # target rather than the old 1e-2, which accepted runs three orders short.
  convergence_rms_target: -11.0

mesh:
  # Generated by cfdagent.cfd.bl_mesher, not committed (~40 MB).
  generator: cfdagent.cfd.bl_mesher
  first_cell_y_plus: 1.0
  n_layers: 35
  growth_ratio: 1.18
  farfield_radius_chords: 60.0
  mesh_filename: mesh.su2
  config_filename: config.cfg
