% ----------------------- SOLVER DEFINITION -------------------------
SOLVER= NAVIER_STOKES
MATH_PROBLEM= DIRECT
KIND_TURB_MODEL= NONE
RESTART_SOL= NO

% ------------------------- PHYSICAL PARAMETERS ---------------------
MACH_NUMBER= 0.5
REYNOLDS_NUMBER= 1.0e6
REYNOLDS_LENGTH= 1.0
AOA= 2.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
VISCOSITY_MODEL= SUTHERLAND

% ---------------------------- MESH INPUT ---------------------------
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

% ------------------------ BOUNDARY CONDITIONS ----------------------
MARKER_FAR= ( Farfield, 0.0, 0.0, 0.0, 0.0 )
% Adiabatic wall handled as a zero heat-flux boundary in recent SU2 versions.
MARKER_HEATFLUX= ( Airfoil, 0.0 )
MARKER_SYM= ( Symmetry )

% ------------------------ NUMERICAL METHOD -------------------------
CONV_NUM_METHOD_FLOW= ROE
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 1.5
ITER= 2200
CONV_RESIDUAL_MINVAL= -12

% ----------------------- OUTPUT INFORMATION ------------------------
HISTORY_OUTPUT= (LIFT, DRAG, LIFT_COEFF, DRAG_COEFF, RMS_DENSITY, RMS_MOMENTUM_X, RMS_MOMENTUM_Y, RMS_ENERGY)
VOLUME_OUTPUT= (MACH, PRESSURE, TEMPERATURE, DENSITY)
OUTPUT_FILES= (RESTART, PARAVIEW)
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow_fields
% Plotting markers replaces the deprecated SURFACE_OUTPUT flag.
MARKER_PLOTTING= ( Airfoil )
SURFACE_FILENAME= surface_airfoil
MARKER_MONITORING= ( Airfoil )
SCREEN_OUTPUT= (ITER, RMS_DENSITY, RMS_MOMENTUM_X, RMS_MOMENTUM_Y, RMS_ENERGY, LIFT, DRAG, LIFT_COEFF, DRAG_COEFF)

% ----------------------- LINEAR SOLVER SETUP -----------------------
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
